[tool.ruff]
line-length = 120
required-version = ">=0.15.5"
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# the checkout puts CTFd/ above this plugin so ruff infers it as first party, the flake sandbox
# copies the plugin alone and would infer third party, pin it so both agree
known-first-party = ["CTFd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.vulture]
paths = ["src", "__init__.py"]
min_confidence = 80
