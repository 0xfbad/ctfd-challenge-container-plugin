{% extends "admin/challenges/update.html" %}

{% block connection_info %}
<div class="form-group d-none">
    <label>
        Connection Info<br>
        <small class="form-text text-muted">
            Use this to specify a link, hostname, or connection instructions for your challenge.
        </small>
    </label>
    <input type="text" class="form-control chal-connection-info" name="connection_info"
        value="{{ challenge.connection_info | default('Container', true) }}">
</div>
{% endblock %}

{% block value %}
<script>
    var container_context_selected = "{{ challenge.docker_context | default('', true) }}";
    var container_image_selected = "{{ challenge.image | default('', true) }}";
    var container_advanced_values = {
        command: "{{ challenge.command | default('', true) }}",
        volumes: "{{ challenge.volumes | default('', true) }}",
        max_memory_mb: "{{ challenge.max_memory_mb | default('', true) }}",
        max_cpu: "{{ challenge.max_cpu | default('', true) }}"
    };
</script>

<div class="form-group">
    <label>
        Value<br>
        <small class="form-text text-muted">
            Points awarded for solving this challenge.
        </small>
    </label>
    <input type="number" class="form-control" name="value" value="{{ challenge.value }}" required min="0">
</div>

<div class="form-group">
    <label>
        Image<br>
        <small class="form-text text-muted">
            Name of the Docker image to spin up.
        </small>
    </label>
    <input type="text" class="form-control" name="image" value="{{ challenge.image | default('', true) }}" placeholder="e.g. tcp-example:latest" required>
    <div id="image-status" style="margin-top: 6px;"></div>
</div>

<div class="form-group">
    <label>
        Connection Type<br>
        <small class="form-text text-muted">
            Connect via web, tcp, or ssh.
        </small>
    </label>
    <select class="form-control" name="ctype" id="connect-type" required>
        <option value="" id="connect-type-default" selected disabled>Choose a value...</option>
        <option value="web">Web</option>
        <option value="tcp">TCP</option>
        <option value="ssh">SSH</option>
    </select>
</div>

<div id="ssh-fields" style="display: none;">
    <div class="form-group">
        <label>
            SSH Username<br>
            <small class="form-text text-muted">
                Username that will be used to connect to the SSH machine.
            </small>
        </label>
        <input type="text" class="form-control" name="ssh_username" value="{{ challenge.ssh_username | default('', true) }}"
            placeholder="e.g. ctf">
    </div>

    <div class="form-group">
        <label>
            SSH Password<br>
            <small class="form-text text-muted">
                Password shown to users in the connection dialog.
            </small>
        </label>
        <select class="form-control" name="ssh_password_mode">
            <option value="none" {% if not challenge.ssh_password %}selected{% endif %}>No password</option>
            <option value="auto" {% if challenge.ssh_password %}selected{% endif %}>Auto-generate password</option>
        </select>
        {% if challenge.ssh_password %}
        <small class="form-text text-muted mt-1">Current: <code>{{ challenge.ssh_password }}</code></small>
        {% endif %}
    </div>
</div>

<div class="form-group">
    <label>
        Port<br>
        <small class="form-text text-muted">
            Internal container port that should be exposed (external port will be automatically assigned).
        </small>
    </label>
    <input type="number" class="form-control" name="port" value="{{ challenge.port }}" required>
</div>

<div class="form-group">
    <label>
        Docker Context<br>
        <small class="form-text text-muted">
            Select which docker context/host will run this challenge's containers.
        </small>
    </label>
    <select class="form-control" name="docker_context" id="docker-context">
        <option value="" selected>Loading contexts...</option>
    </select>
</div>

<div class="form-group">
    <label>
        Expiration<br>
        <small class="form-text text-muted">
            Container lifetime before auto-kill.
        </small>
    </label>
    <input type="hidden" name="expiration_minutes" id="cc-expiry-val" value="{{ challenge.expiration_minutes }}">
    <div class="input-group">
        <input type="number" class="form-control no-spin" id="cc-expiry-h" min="0" placeholder="0" value="{{ (challenge.expiration_minutes or 0) // 60 }}">
        <div class="input-group-append"><span class="input-group-text">h</span></div>
        <input type="number" class="form-control no-spin" id="cc-expiry-m" min="0" max="59" placeholder="0" value="{{ (challenge.expiration_minutes or 0) % 60 }}">
        <div class="input-group-append"><span class="input-group-text">m</span></div>
    </div>
</div>

<div class="form-group">
    <label>
        Max renewals<br>
        <small class="form-text text-muted">
            How many times a user can reset the container timer.
        </small>
    </label>
    <input type="number" class="form-control no-spin" name="max_renewals" id="cc-max-renewals" min="0" value="{{ challenge.max_renewals if challenge.max_renewals is not none else 2 }}">
</div>

<script>
(function() {
    var h = document.getElementById('cc-expiry-h');
    var m = document.getElementById('cc-expiry-m');
    var v = document.getElementById('cc-expiry-val');
    function sync() { v.value = (parseInt(h.value) || 0) * 60 + (parseInt(m.value) || 0); }
    h.addEventListener('input', sync);
    m.addEventListener('input', sync);

    fetch('/containers/api/settings', {
        headers: { 'X-Requested-With': 'XMLHttpRequest', 'CSRF-Token': init.csrfNonce },
        credentials: 'same-origin'
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var s = data.settings || {};
        if (s.default_expiration_minutes) {
            var mins = parseInt(s.default_expiration_minutes.value) || 30;
            h.placeholder = Math.floor(mins / 60) + ' (default)';
            m.placeholder = (mins % 60) + ' (default)';
        }
        if (s.default_max_renewals) {
            document.getElementById('cc-max-renewals').placeholder = s.default_max_renewals.value + ' (default)';
        }
    });
})();
</script>

<style>
    #advanced-toggle .fa-chevron-right { transition: transform 0.2s; }
    #advanced-toggle:not(.collapsed) .fa-chevron-right { transform: rotate(90deg); }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
</style>
<a id="advanced-toggle" class="collapsed" data-toggle="collapse" href="#advanced-section" role="button"
    aria-expanded="false" aria-controls="advanced-section" style="display: inline-block; margin-bottom: 1rem;">
    <i class="fas fa-chevron-right mr-1"></i> Advanced options
</a>

<div class="collapse" id="advanced-section">
    <div class="form-group">
        <label>
            Command<br>
            <small class="form-text text-muted">
                Command to run in the Docker container.
            </small>
        </label>
        <input type="text" class="form-control" name="command" value="{{ challenge.command | default('', true) }}" placeholder="e.g. /bin/sh -c 'exec /start.sh'">
    </div>

    <div class="form-group">
        <label>
            Volumes<br>
            <small class="form-text text-muted">
                Custom volumes to mount, in JSON format. E.g.
                <pre>{"/home/user1/": {"bind": "/mnt/vol2", "mode": "rw"}, "/var/www": {"bind": "/mnt/vol1", "mode": "ro"}}</pre>
            </small>
        </label>
        <input type="text" class="form-control" name="volumes" value="{{ challenge.volumes | default('', true) }}" placeholder='e.g. {"/data": {"bind": "/mnt", "mode": "rw"}}'>
    </div>

    <div class="form-group">
        <label>
            Max Memory (MB)<br>
            <small class="form-text text-muted">
                Maximum memory limit per container in megabytes (leave blank for no limit).
            </small>
        </label>
        <input type="number" class="form-control" name="max_memory_mb" value="{{ challenge.max_memory_mb | default('', true) }}" placeholder="no limit (default)" min="1">
    </div>

    <div class="form-group">
        <label>
            Max CPU<br>
            <small class="form-text text-muted">
                Maximum CPU cores per container as a decimal (leave blank for no limit).
            </small>
        </label>
        <input type="number" class="form-control" name="max_cpu" value="{{ challenge.max_cpu | default('', true) }}" placeholder="no limit (default)" step="0.1" min="0.1">
    </div>

    <div class="form-group">
        <label>
            Extra Capabilities<br>
            <small class="form-text text-muted">
                Comma-separated Linux capabilities to add for network namespace challenges, etc.
            </small>
        </label>
        <input type="text" class="form-control" name="cap_add" value="{{ challenge.cap_add | default('', true) }}" placeholder="e.g. NET_ADMIN,SYS_ADMIN">
    </div>

    <div class="form-group">
        <label>
            Companion Services (JSON)<br>
            <small class="form-text text-muted">
                Companion containers for multi-service challenges. Leave blank for single-container.
            </small>
        </label>
        <textarea class="form-control" name="services_json" rows="3"
            placeholder='e.g. {"sender": {"image": "sender:latest", "command": "/send.sh"}}'>{{ challenge.services_json | default('', true) }}</textarea>
    </div>

    <div class="form-group">
        <label>
            Network Config (JSON)<br>
            <small class="form-text text-muted">
                Custom subnet and static IPs. Leave blank for Docker defaults.
            </small>
        </label>
        <textarea class="form-control" name="network_json" rows="2"
            placeholder='e.g. {"subnet": "10.10.10.0/24", "ips": {"entry": "10.10.10.30"}}'>{{ challenge.network_json | default('', true) }}</textarea>
    </div>
</div>

<script src="/plugins/challenge-containers/src/assets/challenge-form-utils.js"></script>
{% endblock %}
