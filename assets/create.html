{% extends "admin/challenges/create.html" %}

{% block header %}
<div class="alert alert-secondary" role="alert">
    Container challenges dynamically spin up a Docker container for each team to run the challenge on.
</div>
{% endblock %}

{% block value %}
<div class="form-group d-none">
    <label>
        Connection Info<br>
        <small class="form-text text-muted">
            Use this to specify a link, hostname, or connection instructions for your challenge.
        </small>
    </label>
    <input type="text" class="form-control chal-connection-info" name="connection_info" value="Container">
</div>

<div class="form-group">
    <label>
        Value<br>
        <small class="form-text text-muted">
            Points awarded for solving this challenge.
        </small>
    </label>
    <input type="number" class="form-control" name="value" placeholder="100" required min="0">
</div>

<div class="form-group">
    <label>
        Image<br>
        <small class="form-text text-muted">
            Name of the Docker image to spin up. Type to search.
        </small>
    </label>
    <div style="position: relative;">
        <input type="text" class="form-control" id="image-search" placeholder="Loading images..." autocomplete="off">
        <input type="hidden" name="image" id="image-hidden">
        <div class="list-group" id="image-dropdown"
            style="display: none; position: absolute; z-index: 1000; width: 100%; max-height: 300px; overflow-y: auto;">
        </div>
    </div>
</div>

<div class="form-group">
    <label>
        Connection Type<br>
        <small class="form-text text-muted">
            Connect via web, tcp, or ssh.
        </small>
    </label>
    <select class="form-control" name="ctype" id="connect-type" required>
        <option value="web" selected>Web</option>
        <option value="tcp">TCP</option>
        <option value="ssh">SSH</option>
    </select>
</div>

<div id="ssh-fields" style="display: none;">
    <div class="form-group">
        <label>
            SSH Username<br>
            <small class="form-text text-muted">
                Username that will be used to connect to the SSH machine.
            </small>
        </label>
        <input type="text" class="form-control" name="ssh_username" placeholder="Enter username or leave blank">
    </div>

    <div class="form-group">
        <label>
            SSH Password<br>
            <small class="form-text text-muted">
                Password that will be used to connect to the SSH machine.
            </small>
        </label>
        <input type="text" class="form-control" name="ssh_password" placeholder="Enter password or leave blank">
    </div>
</div>

<div class="form-group">
    <label>
        Port<br>
        <small class="form-text text-muted">
            Internal container port that should be exposed (external port will be automatically assigned).
        </small>
    </label>
    <input type="number" class="form-control" name="port" placeholder="80" value="80" required>
</div>

<div class="form-group">
    <label>
        Docker Context<br>
        <small class="form-text text-muted">
            Select which docker context/host will run this challenge's containers.
        </small>
    </label>
    <select class="form-control" name="docker_context" id="docker-context">
        <option value="" selected>Loading contexts...</option>
    </select>
</div>

<div class="form-group">
    <label>
        Expiration (minutes)<br>
        <small class="form-text text-muted">
            Container lifetime in minutes before auto-kill (0 = never expire).
        </small>
    </label>
    <input type="number" class="form-control" name="expiration_minutes" placeholder="30" value="30" min="0">
</div>

<style>
    #advanced-toggle .fa-chevron-right { transition: transform 0.2s; }
    #advanced-toggle:not(.collapsed) .fa-chevron-right { transform: rotate(90deg); }
</style>
<a id="advanced-toggle" class="collapsed" data-toggle="collapse" href="#advanced-section" role="button"
    aria-expanded="false" aria-controls="advanced-section" style="display: inline-block; margin-bottom: 1rem;">
    <i class="fas fa-chevron-right mr-1"></i> Advanced options
</a>

<div class="collapse" id="advanced-section">
    <div class="form-group">
        <label>
            Command<br>
            <small class="form-text text-muted">
                Command to run in the Docker container.
            </small>
        </label>
        <input type="text" class="form-control" name="command" placeholder="Enter command or leave blank">
    </div>

    <div class="form-group">
        <label>
            Volumes<br>
            <small class="form-text text-muted">
                Custom volumes to mount, in JSON format. E.g.
                <pre>{"/home/user1/": {"bind": "/mnt/vol2", "mode": "rw"}, "/var/www": {"bind": "/mnt/vol1", "mode": "ro"}}</pre>
            </small>
        </label>
        <input type="text" class="form-control" name="volumes" placeholder="Enter volumes or leave blank">
    </div>

    <div class="form-group">
        <label>
            Max Memory (MB)<br>
            <small class="form-text text-muted">
                Maximum memory limit per container in megabytes (leave blank for no limit).
            </small>
        </label>
        <input type="number" class="form-control" name="max_memory_mb" placeholder="1024" min="1">
    </div>

    <div class="form-group">
        <label>
            Max CPU<br>
            <small class="form-text text-muted">
                Maximum CPU cores per container as a decimal (e.g., 1.5 for 1.5 cores, leave blank for no limit).
            </small>
        </label>
        <input type="number" class="form-control" name="max_cpu" placeholder="1.0" step="0.1" min="0.1">
    </div>
</div>

<script src="/plugins/individualized-containers/assets/challenge-form-utils.js"></script>
{% endblock %}

{% block type %}
<input type="hidden" value="container" name="type" id="chaltype">
{% endblock %}
